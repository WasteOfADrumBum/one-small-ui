name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check (contrast, typecheck, lint, tests)
        run: npm run check
      - name: Build (library and docs)
        run: npm run build

  # Browser checks run on Ubuntu only. Each suite is its own job, so "Playwright (layout)" and
  # "Playwright (a11y)" are stable names for branch protection.
  playwright:
    name: Playwright (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [layout, a11y]
    # Playwright 1.56 cannot install browsers on the ubuntu-latest image (ubuntu26.04); pin a supported one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Runs on a cache hit too: the browser download is skipped but the OS packages still install.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build (library and docs)
        run: npm run build
      - name: Test (${{ matrix.suite }})
        run: npm run test:${{ matrix.suite }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The packed tarball in clean React 18 and React 19 apps, on every Node version the published package
  # supports at runtime (engines >=18.18). Building the repo itself needs Node 22.13+ (Vite 8, Vitest 5,
  # ESLint 10), so the tarball is built on 22 and only the consumer side runs on the matrix version.
  consumer:
    name: Consumer (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and pack the library
        run: |
          npm run build:lib
          npm pack -w @onesmall/ui --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Consumer smoke test (React 18 and 19)
        run: node scripts/consumer-smoke.mjs "$RUNNER_TEMP"/onesmall-ui-*.tgz
