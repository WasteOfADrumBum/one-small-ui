name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install supported npm CLI
        run: npm install --global npm@11.21.0
      - name: Verify version
        run: node -e "const p=require('./packages/onesmallui/package.json'); if(p.name!=='@onesmall/ui' || p.version!=='0.6.1') process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: npm run build:lib
      - name: Pack and test consumer installation
        run: |
          npm pack -w @onesmall/ui --pack-destination "$RUNNER_TEMP"
          node scripts/consumer-smoke.mjs "$RUNNER_TEMP/onesmall-ui-0.6.1.tgz"
      - name: Publish tested tarball with provenance
        run: npm publish "$RUNNER_TEMP/onesmall-ui-0.6.1.tgz" --access public --provenance
