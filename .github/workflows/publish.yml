name: Publish package

# Release verification and (optionally) publication of @onesmall/ui for one exact candidate commit.
#
#   Actions → "Publish package" → Run workflow on main:
#     candidate_sha     full 40-character SHA of a commit on main
#     expected_version  the version you intend to publish, e.g. 0.6.1 (must equal the candidate's package.json)
#     dry_run           true (default): verify everything, publish nothing
#
# verify  (no registry credentials)  inputs → candidate on main, metadata consistent → the candidate's CI and
#         CodeQL runs on main are complete and green (exact SHA, this repository, trusted workflow files, latest
#         attempt, every mandatory job) → download that CI run's package artifact → digest matches its manifest.
# rebuild / reproducible  the candidate is rebuilt in an isolated read-only job with the same Node, and the
#         release tooling requires identical bytes.
# consumer  the verified tarball in clean React 18/19 apps on Node 18–24 (digest enforced).
# dry-run   `npm publish --dry-run` of the verified tarball (dry_run only; still no credentials).
# publish   only with dry_run false, from main, in the npm-publish environment: OIDC trusted publishing with
#           provenance of exactly that tarball, then registry integrity is compared with the verified digest.
#
# Nothing here creates tags or releases, changes dist-tags, or writes to the repository. docs/ci-cd.md has the
# procedure, the evidence it leaves, and recovery steps.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA on main to verify (and publish)
        required: true
        type: string
      expected_version:
        description: Version you expect the candidate to publish, e.g. 0.6.1
        required: true
        type: string
      dry_run:
        description: Verify only; publish nothing
        required: true
        type: boolean
        default: true

permissions: {}

# One release at a time, and a started release is never cancelled by a newer one.
concurrency:
  group: publish-onesmall-ui
  cancel-in-progress: false

jobs:
  verify:
    name: Verify candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
      integrity: ${{ steps.identity.outputs.integrity }}
      filename: ${{ steps.identity.outputs.filename }}
      node: ${{ steps.identity.outputs.node }}
      ci_run_id: ${{ steps.checks.outputs.ci_run_id }}
    env:
      CANDIDATE: ${{ inputs.candidate_sha }}
      VERSION: ${{ inputs.expected_version }}
    steps:
      # The verification code is the workflow's own ref (main for a real release), never the candidate's.
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tools
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate inputs
        run: node tools/scripts/release-verify.mjs inputs --sha "$CANDIDATE" --version "$VERSION"
      - name: Refuse publication outside main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publication runs only from main (this run is on $GITHUB_REF)."
          exit 1
      # Git history and package metadata only: nothing from the candidate is executed in this job.
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Candidate, branch and package metadata
        run: |
          git -C candidate fetch --no-tags origin main
          node tools/scripts/release-verify.mjs candidate --dir candidate --sha "$CANDIDATE" --version "$VERSION"
      - name: Required checks on the exact candidate
        id: checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/scripts/release-verify.mjs checks --sha "$CANDIDATE" --evidence "$RUNNER_TEMP/release-evidence.json"
      - name: Download the CI package artifact of the verified run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/ci-package
          run-id: ${{ steps.checks.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Artifact identity (manifest, commit, version, digest)
        id: identity
        env:
          CI_RUN_ID: ${{ steps.checks.outputs.ci_run_id }}
        run: |
          file=$(node -p "require(process.env.RUNNER_TEMP + '/ci-package/package-manifest.json').filename")
          node tools/scripts/release-verify.mjs artifact --manifest "$RUNNER_TEMP/ci-package/package-manifest.json" --tarball "$RUNNER_TEMP/ci-package/$file" --sha "$CANDIDATE" --version "$VERSION" --run-id "$CI_RUN_ID"
      - name: Stage the verified release artifact
        run: |
          file=$(node -p "require(process.env.RUNNER_TEMP + '/ci-package/package-manifest.json').filename")
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/ci-package/$file" "$RUNNER_TEMP/ci-package/package-manifest.json" "$RUNNER_TEMP/release-evidence.json" "$RUNNER_TEMP/release/"
      # Uploaded before any candidate code runs; artifact names are immutable within a run, so a later job can't
      # replace it.
      - name: Upload the verified release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90

  # Candidate code (npm install scripts, the build) runs only here: a job with a read-only contents token, no
  # registry credentials, no caches, and nothing it produces is trusted except the bytes compared below.
  rebuild:
    name: Independent rebuild
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.verify.outputs.node }}
      - name: Build and pack
        run: |
          npm ci --no-audit --no-fund
          npm run build:lib
          mkdir -p "$RUNNER_TEMP/rebuilt"
          npm pack -w @onesmall/ui --pack-destination "$RUNNER_TEMP/rebuilt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-package
          path: ${{ runner.temp }}/rebuilt/
          if-no-files-found: error
          retention-days: 7

  # Rebuilding with the Node version that built the artifact must reproduce it byte for byte: the bytes we
  # publish are then the ones the candidate's source produces, not only what a run says it produced. The
  # comparison runs the release tooling from the workflow's ref, never candidate code.
  reproducible:
    name: Rebuild matches the CI artifact
    needs: [verify, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CANDIDATE: ${{ inputs.candidate_sha }}
      VERSION: ${{ inputs.expected_version }}
      FILE: ${{ needs.verify.outputs.filename }}
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tools
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebuilt-package
          path: ${{ runner.temp }}/rebuilt
      - name: Compare
        run: node tools/scripts/release-verify.mjs artifact --manifest "$RUNNER_TEMP/release/package-manifest.json" --tarball "$RUNNER_TEMP/release/$FILE" --sha "$CANDIDATE" --version "$VERSION" --rebuilt "$RUNNER_TEMP/rebuilt/$FILE"

  consumer:
    name: Consumer (Node ${{ matrix.node }})
    needs: [verify, reproducible]
    strategy:
      fail-fast: true
      matrix:
        node: [18, 20, 22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/consumer-smoke.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Consumer smoke test of the verified tarball
        env:
          FILE: ${{ needs.verify.outputs.filename }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
        run: node scripts/consumer-smoke.mjs "$RUNNER_TEMP/release/$FILE" "--sha256=$SHA256"

  dry-run:
    name: Publish dry run
    if: ${{ inputs.dry_run }}
    needs: [verify, reproducible, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm publish --dry-run of the verified tarball
        env:
          FILE: ${{ needs.verify.outputs.filename }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
          VERSION: ${{ inputs.expected_version }}
          CANDIDATE: ${{ inputs.candidate_sha }}
          CI_RUN_ID: ${{ needs.verify.outputs.ci_run_id }}
        run: |
          cd "$RUNNER_TEMP/release"
          echo "${SHA256}  ${FILE}" | sha256sum -c -
          if npm view "@onesmall/ui@${VERSION}" version 2>/dev/null | grep -q .; then
            echo "::warning::@onesmall/ui@${VERSION} is already on npm; a real publish of this version would be refused."
          fi
          npm publish "./${FILE}" --dry-run --access public
          {
            echo "### Dry run: nothing was published"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Candidate | \`${CANDIDATE}\` |"
            echo "| Package | \`@onesmall/ui@${VERSION}\` |"
            echo "| Tarball | \`${FILE}\` |"
            echo "| sha256 | \`${SHA256}\` |"
            echo "| CI run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    needs: [verify, reproducible, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Protection rules (required reviewer, main only) are configured on the environment in repository settings;
    # the workflow can't prove they exist. See docs/ci-cd.md.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install supported npm CLI (trusted publishing needs npm 11.5+)
        run: npm install --global npm@11.21.0
      - name: Verify the tarball and that the version is new
        env:
          FILE: ${{ needs.verify.outputs.filename }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
          VERSION: ${{ inputs.expected_version }}
        run: |
          cd "$RUNNER_TEMP/release"
          echo "${SHA256}  ${FILE}" | sha256sum -c -
          if npm view "@onesmall/ui@${VERSION}" version 2>/dev/null | grep -q .; then
            echo "::error::@onesmall/ui@${VERSION} is already published; npm versions are immutable."
            exit 1
          fi
      # Irreversible from here. The job is serialized by the workflow concurrency group and not cancelled by it.
      - name: Publish the verified tarball with provenance
        env:
          FILE: ${{ needs.verify.outputs.filename }}
        run: npm publish "$RUNNER_TEMP/release/$FILE" --access public --provenance
      - name: Registry integrity equals the verified artifact
        env:
          INTEGRITY: ${{ needs.verify.outputs.integrity }}
          VERSION: ${{ inputs.expected_version }}
        run: |
          for i in 1 2 3 4 5; do
            got=$(npm view "@onesmall/ui@${VERSION}" dist.integrity 2>/dev/null || true)
            [ -n "$got" ] && break
            sleep $((i * 10))
          done
          echo "registry: $got"
          echo "verified: $INTEGRITY"
          [ "$got" = "$INTEGRITY" ]
